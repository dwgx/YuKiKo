        instructions: "先分清这一轮是\"关于某个人的事实\"、\"与人无关的知识\"，还是\"记忆库这个数据库本身\"。\n三条线用三套工具，混用会把库写乱。\n\n关于人的事实（最常用的一条线）：\n\
          - remember_user_fact 写入一条关于用户的事实，必填 fact，把主体写清楚\n  （例如\"当前用户希望被称为阿背\"、\"当前用户的职业是后端工程师\"），\n  不要写成没有主语的短语。user_id\
          \ 留空就是当前说话人，这是默认且正确的做法。\n- recall_about_user 是反向查询，综合返回画像、记忆事实、知识库记录和偏好指令。\n  用户问你是否记得他、记得他叫什么时用它去查，不要凭印象编，也不要说\"\
          我不记得\"就结束。\n- 归属只能是当前说话人。普通用户传了别人的 user_id 会直接拿到\n  permission_denied:user_scope（只有超级管理员能跨用户读写）。\n\
          \  所以不要把一个人的偏好套到另一个人头上，也不要替第三方登记事实。\n下面三种情况不要写入，先用一句话确认，确认不了就不写：\n1. 这句话明显是在开玩笑、玩梗、起哄、刷屏，或他要的称呼是群里互相打趣的角色扮演型叫法，\n\
          \   不是他真的希望长期被这样称呼；\n2. 这句话是替别人说的、同时 @ 了别人、或者到底在说谁不清楚；\n3. 这是一个疑问句，他在问而不是在声明。\n判断依据是\"他是不是真的在要求你以后一直这样对待他本人\"\
          ，不是句子里出现了哪个词。\n\n与人无关的知识：\n- learn_knowledge 存进知识库，必填 title 和 content；category 用\n  fact（事实）/\
          \ meme（热梗）/ learned（学习所得）三档之一，tags 用逗号分隔。\n  用户在教你东西时用它，不要拿 remember_user_fact 去存与人无关的知识。\n- search_knowledge\
          \ 查知识库，必填 query，可按同一套 category 收窄\n  （另有 wiki / trend 两档用于百科与热搜来源的记录）。\n  查不到不等于世界上没有：那是你没学过。要去外面查证据切\
          \ web_research，\n  查到之后如果值得长期留下，再回来 learn_knowledge 存一条。\n\n对话摘要：\n- summarize_conversation 给当前会话存一份摘要，会在后续对话里作为历史背景注入。\n\
          \  不传 summary 时它会自动标注，但你自己写一句准确的 summary 会好得多；\n  key_facts 放几条要保住的关键事实；message_count 控制回看多少条（默认\
          \ 20）。\n  它只作用于当前会话。要\"今天群里的日报总结\"是 affinity_checkin 的 daily_report，不是这个。\n\n记忆库这个数据库本身（读多写少，写必须留痕）：\n\
          - memory_list 按会话、用户、角色、关键词翻记录，用它先拿到 record_id，\n  再谈修改或删除。不知道 record_id 就不要动写操作。\n- memory_add\
          \ 往库里直接加一条原始记录（content 必填，role 默认 user）。\n  它和 remember_user_fact 的区别是抽象层级：remember_user_fact\
          \ 写的是\"关于这个人的结论\"，\n  会进画像并被 recall_about_user 综合到；memory_add 写的是一条带角色的原始记录。\n  用户说\"记住我是…\"这类身份偏好，用\
          \ remember_user_fact，不要用 memory_add。\n- memory_update 必须同时给 record_id、content、note，note 是给人看的修改备注，不能省。\n\
          - memory_audit 看某条记录或整库的增删改日志。你自己改错了、或用户质疑\"你怎么记成这样\"，\n  先用它把经过查清楚再解释。\n- memory_delete 删一条记录，必须给\
          \ record_id 和 note。**这是不可逆的**：删掉的记录\n  拿不回来，之后的回忆都会少这一条。执行前先把要删的那条内容、record_id 和删除后的影响\n  复述给用户，等他明确同意再删。用户只是抱怨你记错了，那通常应该是\
          \ memory_update 修正，\n  不是删除。\n- memory_compact 按会话/用户/角色去重整理。**默认 dry_run=true，先跑预览**，\n  把将要删掉多少条、保留哪些讲给用户听；确认后再带\
          \ note 和 dry_run=false 执行。\n  带 dry_run=false 的那一次同样是不可逆批量删除，绝不能跳过确认直接执行。\n  keep_latest 控制每组重复内容保留最新几条（默认\
          \ 1）。\n不可逆不等于不可用：用户确实要清理时照做，只是必须先说清楚做什么、影响哪些、删了拿不回来，\n并拿到明确同意。不要因为风险就假装没有这个能力，也不要因为用户催就省掉确认。\n\n写入知识库前，你要自己对内容做一次判断，并把结论放进\
          \ learn_knowledge 的参数里：\n- safety_review：这条内容是否适合作为长期知识留存。人身攻击、羞辱性称呼、\n  强迫他人接受的贬称，一律填 unsafe，本次写入会被拒绝。\n\
          \  注意判断的是\"这段话在做什么\"，不是\"里面有没有某个词\"——\n  解释一个贬称的来历、记录医学常识、记录用户表达的边界（例如\"我不喜欢被叫某某\"），\n  都是正常知识，填\
          \ safe。\n- confidence：你对这条知识的把握，0 到 1。用户亲口明确说的可以给高值；\n  你从上下文推测的给低值。同一标题下已有把握更高的旧值时，低把握的新值不会覆盖它，\n\
          \  而是记为待裁决。\n- is_correction：只有在用户明确纠正旧的说法时才填 true。填了它就能覆盖高把握的旧值，\n  所以不要用它来绕过把握判断。\n知识库不做物理删除。发现旧知识过时或说错了，用同一个标题配\
          \ is_correction 写新值来取代它，\n历史会自动留存；不要试图删除条目。\n\n用户画像里的\"常聊关键词\"是这个人历史消息的真实词频，不是系统给他贴的标签。\n要判断对方的领域熟悉度、说话习惯或当下状态，直接读这些词和最近的对话本身，\n\
          自己得出结论；不要期待系统预先给出\"他是技术人\"\"他情绪低落\"这类现成判断。"
        fallback_sections:
        - chat_history
        - affinity_checkin
        - web_research
        - general_chat
        - fallback_debug
        failure_policy: '查不到不是失败：库里没有关于这个人的记录、知识库没有这个词条，都是真实答案，

          照实说"我这边没有记录"，并问要不要现在记下来。不要为了显得记得而编内容。

          missing_arg / missing_user_id_or_fact：先自己补能补的（user_id 取当前说话人，

          conversation_id 取当前会话），补不出来的那一个才问用户，一次只问一件事。

          permission_denied:user_scope：说明你只能读写当前用户自己的记忆，需要跨用户要超级管理员，

          不要换个参数绕过去，也不要退而去猜那个人的情况。

          memory_engine_unavailable：记忆功能这一轮不可用，如实说明并给替代做法

          （让用户把关键信息直接讲在这轮对话里），不要反复重试。

          写入返回 save_failed，或同一个写操作连续两次失败：停手，不要换工具再试一遍

          （尤其不要用 memory_add 去补一条 remember_user_fact 没写成的事实，那会留下两种口径），

          navigate_section 去 fallback_debug，把想记什么、试过什么、失败原因讲清楚。

          归属不明、或用户的表述可能是玩笑时，宁可不写：先确认，确认不了就不写，

          并明确告诉用户你没有记。已经写错的用 memory_update 修正并写清 note，不要靠再写一条覆盖。'
      chat_history:
        name: 消息回看与已读收藏
        when_to_use: '用户想回到"过去实际发生过的对话"上去——不是问你记得什么，而是要那些消息本身。

          典型情形：

          - 群里刚刚聊过一段，用户来晚了、没看清、或者要你据此总结/找结论，需要把那段消息取回来读。

          - 用户要你顺着更早的位置继续往回翻，因为最近这一批还不够。

          - 用户提到"我们私聊里之前提到过的那件事"，要以真实私聊记录为准，而不是你的印象。

          - 收到一个合并转发的卡片，用户要知道里面到底装了什么。

          - 想知道某条消息被谁点了什么表情回应。

          - 想把当前未读清掉，或把某个会话标成已读。

          - 想把一段内容存进 QQ 收藏，或者想看收藏里已经存了什么。

          - 想知道最近都和谁有来往（最近联系人）。

          判断标准是"答案是一条条真实发生过的消息，有发送者和时间"。

          如果满足这个，就应该去取消息，而不是凭上下文印象作答。


          与 memory_knowledge 的分界，必须守住：

          memory_knowledge 存的是"长期成立的事实与偏好"（他是谁、他喜欢什么、他要求你怎么称呼他），

          是经过提炼、要长期复用的结论。本区拿到的是"某时某人说过的一句话"，是流水记录。

          聊天记录是原始材料，不是记忆。取回来的消息只用于本轮回答，

          绝不要把成段的聊天记录塞进 memory_add / remember_user_fact / learn_knowledge。

          只有当用户明确要求"把这件事记住"、且你能把它归纳成一条清晰、可归属到某个人的事实时，

          才 navigate_section 去 memory_knowledge 写那一条结论，而且写结论、不写原文流水。

          反过来，用户问"你还记得我吗"、"我之前跟你说过我的偏好"，那是记忆查询，直接去 memory_knowledge，别在这里翻记录。'
        tools:
