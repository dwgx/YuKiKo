        failure_policy: "- 没有找到匹配的表情 / 表情包：先 list_faces、list_emojis 或 browse_sticker_categories\n  看清库里到底有什么，再换一个更贴近的\
          \ query 重试一次；还是没有就改成随机一张，\n  或者用文字把这个情绪说出来。不要把表情请求当普通文本糊过去，也不要说已经发了。\n- 表情包库为空、还没学习任何表情包：直接告诉用户库是空的，并说明可以发一张图让你\n\
          \  收录（learn_sticker），不要反复重试发送。\n- 还没有可发送的最近表情包（select=latest 时）：说明最近没有学习记录，\n  问用户是要随机来一张还是先学一张。\n\
          - emoji_disabled_by_control：管理员把表情功能关了，这是配置决定的，用文字回应即可，\n  不要换别的表情工具绕过去。\n- \"当前语境不适合发表情\"：这是发送频率控制在起作用，不是你选错了工具。\n\
          \  最多再试一次，之后用文字表达同样的情绪，不要连着刷。\n- 缺 query 参数：把主题词补上再调，不要用空 query 重试。\n- learn_sticker 拿不到图片：请用户把要收录的图重新发一次或直接回复那张图。\n\
          - 表情系统未初始化 / api_call 不可用 / 表情包 key 丢失 / 表情包发送数据不存在：\n  这是环境或数据问题，照实说，不要换工具反复试。\n- 无法确定发送目标：说明当前会话拿不到群号或用户号，不要猜一个发出去。\n\
          同一个工具连续两次失败就停手，切 fallback_debug 说明试过什么、缺什么。\n绝对不要在没有成功发送的情况下说\"表情已经发出去了\"。"
      memory_knowledge:
        name: 长期记忆与知识库
        when_to_use: "要读或写\"长期成立的结论\"时来这里：关于某个人的事实与偏好、你学到的知识、对话摘要。\n典型情形：\n- 用户告诉你该怎么称呼他、他叫什么、他是谁、他做什么、他喜欢或讨厌什么，\n\
          \  并且希望你以后一直照此对待他。不管他说成陈述句、请求句还是随口一提，都属于这一类。\n- 用户反问你是不是记得他、记得他叫什么、记得他说过的偏好，要你按记录回答而不是凭印象。\n-\
          \ 用户要你改掉或忘掉之前记住的某件事，或指出你记错了。\n- 用户在教你一个新知识、新梗、新概念、一个术语的含义，希望以后你就知道了。\n- 用户要查知识库里已经学过什么，或问某个梗、某个事实你这边有没有记录。\n\
          - 这一轮对话很长、信息很密，需要压成摘要保住关键信息，防止后面上下文丢掉。\n- 需要核对记忆库本身：某条记录是什么、谁改过它、库里是不是攒了一堆重复的。\n与 chat_history\
          \ 的分界必须守住：本区存的是经过提炼、要长期复用的结论；\nchat_history 拿到的是\"某时某人说过的一句话\"，是流水原始材料。\n用户要的是那些消息本身（刚才谁说了什么、把上面翻出来）就去\
          \ chat_history，不要在这里翻。\n反过来，聊天记录不是记忆：绝不要把成段的原始对话塞进记忆库或知识库。\n与 affinity_checkin 的分界：好感度、打卡天数、心情、用户画像档案是那边的运行时数据，\n\
          由那边的工具读写；本区管的是你自己记下来的事实与知识。\n\"了解一下某人是什么样的人\"这种档案式提问优先去 affinity_checkin 的 user_portrait；\n\"\
          他跟我说过什么、他有什么偏好\"才是本区的 recall_about_user。"
        tools:
        - remember_user_fact
        - recall_about_user
        - learn_knowledge
        - search_knowledge
        - summarize_conversation
        - memory_list
        - memory_add
        - memory_update
        - memory_delete
