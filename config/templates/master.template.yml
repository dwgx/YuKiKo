        failure_policy: '返回空或数据为零不是失败：新用户好感度就是初始值、今天日报还不够料、还没创建过技能，

          都照实说，并给一个自然的下一步（例如邀请他打卡），不要换工具反复试。

          checkin 报"缺少 user_id"：说明当前上下文没拿到说话人，先确认是谁在打卡再重试一次即可。

          set_group_sign 报 missing group_id：群聊里从环境补当前群号；私聊里没有当前群，

          就问一句要在哪个群签到。

          permission_denied:user_scope（user_portrait 跨用户）：如实说明这需要超级管理员权限，

          不要改用 get_affinity、daily_report 或聊天记录去侧面拼出那个人的画像。

          memory_engine_unavailable（daily_report / user_portrait）：这两个依赖记忆引擎，

          不可用时如实说明，不要用 chat_history 抓消息自己伪造一份日报或画像。

          QQ 群签到失败（接口不支持、当天已签、扩展功能不可用）：把 QQ 返回的原因照实转述，

          并说明这是 QQ 侧的群签到、和好感度打卡是两回事，需要的话可以改做好感度打卡。

          同一个目标连续两次失败就停手，navigate_section 去 fallback_debug，

          说清试过哪些工具、失败原因、还缺什么。任何情况下都不要编造好感度数值、排名、

          连续天数或日报内容——这些数字用户会当真。'
      bot_selfconfig:
        name: 机器人自身配置与运维
        when_to_use: "用户要动的是**机器人自己**——它的说话方式、它的配置、它的身份门面、它的运行状态，\n而不是某个群、某个人或某条消息。\n典型情形：\n- 希望机器人改变自己插话的多少：完全停下来只在被点名时回应、门槛提高偶尔接话、更活跃地多接话、回到默认。\n\
          \  这类要求可能说得很不像命令：一句抱怨、一个玩笑、一句反问、甚至只有两个字。\n  判断标准是\"这句话的作用对象是机器人自己的发言行为\"，不是他用了哪个说法。\n- 希望机器人不再回应某个人，或者重新开始回应他，或者想知道现在有谁被这样对待着。\n\
          - 希望机器人重新读一遍配置文件让改动生效，或者直接改某一项配置。\n- 想知道机器人现在活着没有、跑了多久、处理了多少消息、装了哪些插件、用的哪个模型。\n- 想调机器人输出内容的松紧程度，或者增删输出时要屏蔽掉的词。\n\
          - 想把当前这个群纳入机器人的服务白名单、移出白名单，或者看看白名单里有哪些群。\n- 想开启或关掉\"做危险操作前先问一遍\"这条规则。\n- 想刷新各视频平台的登录凭证，因为解析类功能开始报未登录。\n\
          - 想让机器人去拉取远端的新版本代码。\n- 关心表情包库本身的状态：现在有多少、重新扫一遍目录、把还没登记的批量登记掉。\n- 想改机器人的门面：昵称、个性签名、头像、在线状态（在线/离开/隐身/忙碌/Q我吧/请勿打扰）。\n\
          - 想清掉机器人本地的缓存，或者查机器人自己的 QQ 号和昵称。\n- 想让机器人发骰子、猜拳，或者往群里刷屏把上面的消息顶走。\n- 想管理绑定的 API 站点账号（绑定、查余额、查令牌、充值、签到这类）。\n\
          \n与相邻分区的分界，这一条最容易搞错：\n- \"让机器人少说话/闭嘴\"是改机器人的行为参数，在本区；\n  \"把我禁言十分钟\"、\"禁言他\"是对真实 QQ 号做群禁言，在 qq_admin_social。两者完全不同，别混。\n\
          - \"别理他\"是让机器人忽略这个人（本区，机器人自己不再回应他）；\n  \"把他踢了\"、\"禁了他\"是动群成员（qq_admin_social）。用户经常两件一起说，那就两个分区各做一件。\n\
          - 发表情包/表情回应在 sticker_emoji；点歌播歌在 music_audio；生成图片在 creative_generation。\n- 查 NapCat/OneBot 自身的连接与版本状态在\
          \ fallback_debug。"
